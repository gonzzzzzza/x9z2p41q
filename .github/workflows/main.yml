name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        run: python generar_epg.py

      - name: Update EPG on AlwaysData
        run: |
          set -e
          urls=(
            "https://gonza.alwaysdata.net/epg-movistar/index.php?action=generar_epg"
            "https://gonza.alwaysdata.net/epg-mvshub/index.php?action=generar_epg"
            "https://gonza.alwaysdata.net/epg-vivo/index.php?action=generar_epg"
            "https://gonza.alwaysdata.net/epg-tv360/index.php?action=generar_epg"
          )

          for url in "${urls[@]}"; do
            echo "Disparando: $url"
            resp=$(curl -fsSL --max-time 180 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36" \
              "$url")
            echo "Respuesta: $resp"
          done

      - name: Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Bot"
          git add data_v9.xml
          if git diff --staged --quiet; then
            echo "No hay cambios para subir"
          else
            git commit -m "upd $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
