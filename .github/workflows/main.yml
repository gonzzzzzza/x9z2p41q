name: Update
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Script
        run: python generar_epg.py
      - name: Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Bot"
          git add data_v9.xml
          git commit -m "upd" || exit 0
          git push
